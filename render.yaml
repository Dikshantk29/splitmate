services:
  - type: web
    name: splitmate-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splitmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: splitmate-db
    databaseName: splitmate
    user: splitmate_user
    postgresMajorVersion: "16"
    plan: free
    region: singapore
